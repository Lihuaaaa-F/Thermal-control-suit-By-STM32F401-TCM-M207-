<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>调温服控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="verbar" class="verbar hidden"></div>
<div id="alarmbar" class="alarmbar hidden"></div>

<header>
  <div class="hgroup">
    <span class="dot" id="dot"></span>
    <span id="conn">连接中…</span>
  </div>
  <div class="hgroup right">
    <span id="uptime">--:--</span>
    <button id="btn-ack" class="mini hidden">确认恢复</button>
  </div>
</header>

<main id="app" class="hidden">
  <!-- ① hero：双水温大数值（数值字体阶梯移动端等效 40px）-->
  <div class="heroes">
    <div class="hcard"><div class="ttl">贴身水箱</div>
      <span class="val" id="t1">--.-</span><span class="unit"> °C</span>
      <canvas id="g1" width="140" height="140"></canvas></div>
    <div class="hcard"><div class="ttl">环境水箱</div>
      <span class="val" id="t2">--.-</span><span class="unit"> °C</span>
      <canvas id="g2" width="140" height="140"></canvas></div>
  </div>

  <!-- ② 曲线+导出（体温）-->
  <section class="card">
    <h2>体温 <span class="unit" style="font-size:13px;color:var(--tx2)">当前 <b id="tb" style="color:var(--hero)">--.-</b> °C</span>
      <canvas id="g3" width="140" height="140" style="width:44px;height:44px;vertical-align:middle;float:right;margin-top:-4px"></canvas></h2>
    <canvas id="curve" height="180"></canvas>
    <button id="btn-csv" class="csv">导出 CSV</button>
    <div class="switches">
      <button class="sw" id="sw-tec1">TEC1</button>
      <button class="sw" id="sw-tec2">TEC2</button>
      <button class="sw" id="sw-fan">风扇</button>
      <button class="sw" id="sw-mode">自动</button>
    </div>
  </section>

  <!-- ③ 参数区（registry 动态渲染，仅 PF_WEB）-->
  <section class="card">
    <h2>参数</h2>
    <div id="params"></div>
  </section>

  <!-- ④ 高级区（M207 参数，registry 出现即自动生成）-->
  <section class="card">
    <details id="adv-details">
      <summary>高级参数（M207）</summary>
      <div id="adv-params"></div>
    </details>
  </section>
</main>

<!-- ⑤ 急停：常驻底部拇指区（独占、永不变）-->
<div class="estop-wrap">
  <button id="btn-estop" class="estop">急停</button>
</div>

<div id="overlay" class="overlay hidden">
  <div class="overlay-box">
    <div id="ov-title">连接断开</div>
    <div id="ov-sub">重连中 <span id="ov-count">--</span>s</div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="/chart.umd.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
