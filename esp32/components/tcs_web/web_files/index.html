<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>调温服控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="verbar" class="verbar hidden"></div>
<div id="alarmbar" class="alarmbar hidden"></div>

<header>
  <div class="hgroup">
    <span class="dot" id="dot"></span>
    <span id="conn">连接中…</span>
  </div>
  <div class="hgroup right">
    <span id="uptime">--:--</span>
    <button id="btn-ack" class="mini ok hidden">确认恢复</button>
  </div>
</header>

<main id="app" class="hidden">
  <!-- ① 状态区 -->
  <section class="card">
    <h2>水温</h2>
    <div class="gauges">
      <div class="gauge"><canvas id="g1" width="140" height="140"></canvas>
        <div class="glabel">贴身<br><b id="t1">--.-</b>°C</div></div>
      <div class="gauge"><canvas id="g2" width="140" height="140"></canvas>
        <div class="glabel">环境<br><b id="t2">--.-</b>°C</div></div>
      <div class="gauge"><canvas id="g3" width="140" height="140"></canvas>
        <div class="glabel">体温<br><b id="tb">--.-</b>°C</div></div>
    </div>
    <canvas id="curve" height="180"></canvas>
    <div class="switches">
      <button class="sw" id="sw-tec1">TEC1</button>
      <button class="sw" id="sw-tec2">TEC2</button>
      <button class="sw" id="sw-fan">风扇</button>
      <button class="sw" id="sw-mode">自动</button>
    </div>
  </section>

  <!-- ② 参数区（registry 动态渲染，仅 PF_WEB）-->
  <section class="card">
    <h2>参数</h2>
    <div id="params"></div>
  </section>

  <!-- ③ 高级区（M207 参数，registry 出现即自动生成）-->
  <section class="card">
    <details id="adv-details" open>
      <summary>高级参数（M207）</summary>
      <div id="adv-params"></div>
    </details>
  </section>

  <!-- ④ 急停 -->
  <section class="card">
    <button id="btn-estop" class="estop">急　停</button>
  </section>
</main>

<div id="overlay" class="overlay hidden">
  <div class="overlay-box">
    <div id="ov-title">连接断开</div>
    <div id="ov-sub">重连中 <span id="ov-count">--</span>s</div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="/chart.umd.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
